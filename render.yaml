# Free compute only. Persistent data lives in a separate Supabase Free project.
# Do not add a paid disk or a Render Free Postgres (it expires after 30 days).
services:
  - type: web
    name: fluent-studio
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/elijahflanagan48-hue/fluent
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.hosted
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: FLUENT_HOSTING
        value: free
      - key: FLUENT_STORAGE
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: fluent-private
      - key: FLUENT_SETUP_TOKEN
        generateValue: true
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
