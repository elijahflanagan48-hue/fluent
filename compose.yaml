services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FLUENT_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - studio-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build: .
    command: ["python", "worker.py"]
    restart: unless-stopped
    env_file: .env
    environment:
      FLUENT_DATA_DIR: /data
    volumes:
      - studio-data:/data
    depends_on:
      app:
        condition: service_healthy
volumes:
  studio-data:
